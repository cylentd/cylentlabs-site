<style>
/* The two type families, served from this site (latin subset, woff2) so the first paint waits on no other host.
   Both are SIL Open Font License 1.1 (see assets/fonts/LICENSE.md). Hanken Grotesk is one variable file for 400-600. */
@font-face {
  font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 600; font-display: swap;
  src: url("/assets/fonts/hanken-grotesk-latin.woff2") format("woff2");
}
@font-face {
  font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("/assets/fonts/instrument-serif-latin.woff2") format("woff2");
}
@font-face {
  font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap;
  src: url("/assets/fonts/instrument-serif-italic-latin.woff2") format("woff2");
}

/* Every colour, space, type and motion value lives here. A literal anywhere else is a bug. */
:root {
  /* colour map: ember = the primary action, ink = text, bg = night, signal = background dust. Grey only for dimmed. */
  --bg: #07090c;
  --bg-lift: #0d1116;
  --ink: #f3ede4;
  --ink-dim: #8b8f96;
  --ember: #ff7a3d;
  --ember-soft: #ffb27a;
  --signal: #6fa8d8;
  --line: rgba(243, 237, 228, 0.14);

  /* one hue per project: its rungs on the helix, its motif, its name. Order matches shapes.js L.HUES */
  --hue-jarvis: #ff7a3d;
  --hue-teamwatch: #6fa8d8;
  --hue-tcg: #f2c14e;
  --hue-seat: #4fc3b0;
  --hue-lock: #b48cf0;

  /* type */
  --font-display: "Instrument Serif", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: clamp(1.75rem, 1.3rem + 2vw, 2.75rem);
  --step-3: clamp(2.5rem, 1.9rem + 2.6vw, 3.75rem);

  /* space */
  --gutter: 16px;
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 40px;
  --space-5: 72px;
  --space-6: 120px;
  --radius: 14px;
  /* the header and footer rows stop growing here and centre, so a very wide window doesn't push them to its edges */
  --bar-max: 1280px;

  /* sizes: the showcase is always the biggest thing in a chapter; the motif above it stays smaller */
  --show-w: 300px;
  --motif-w: 360px;

  /* motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 160ms;
  --t-slow: 700ms;
  /* field: particle counts, sizes (px), and how faint the background dust is next to shape dots */
  --field-count: 5200;
  --field-count-phone: 1800;
  --dot: 2;
  --dot-lit: 3.2;
  --dot-phone: 2.2;
  --dot-lit-phone: 3;
  --dust: 0.45;
}

@media (min-width: 900px) {
  :root { --gutter: 48px; }
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: var(--step-0) / 1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: var(--ember); color: var(--bg); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; border-radius: 4px; }
a { color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; } /* img { display: block } would otherwise override the hidden attribute */

/* scrollbar */
html { scrollbar-color: var(--ember) var(--bg); scrollbar-width: thin; }

.field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
/* the page's landmarks sit side by side in body, each lifted above the fixed field */
body > header, main, body > footer { position: relative; z-index: 1; }

.skip {
  position: absolute; left: var(--gutter); top: -100px;
  background: var(--ember); color: var(--bg); padding: var(--space-1) var(--space-2);
  border-radius: var(--radius); z-index: 10;
}
.skip:focus { top: var(--space-2); }

/* The hero: a header, then the helix and its project names, filling the screen. The field draws the helix inside
   .helix__stage; helix.js places each name beside its rung group and marks the box .is-placed. */
.hero { min-height: 94svh; display: flex; flex-direction: column; padding: var(--space-3) var(--gutter) var(--space-2); }
.hero__bar {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 var(--space-2);
  width: 100%; max-width: var(--bar-max); margin-inline: auto;
  font-size: var(--step--1); color: var(--ink-dim);
}
.hero__mark { margin: 0; font: inherit; color: var(--ink); }
/* the wordmark with the lab link beside it; .lablink is the same link again in the footer */
.hero__left { display: flex; align-items: baseline; gap: var(--space-3); }
.lablink { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink-dim); text-decoration: none; transition: color var(--t-fast); }
.lablink:hover { color: var(--ember-soft); }
/* David's line: a quote off to the side in his own voice, not a headline. The helix stands left of centre, so on wide
   screens the line floats in the hero's right side; on phones it sits above the helix. */
.hero { position: relative; }
.hero__quote { margin: var(--space-3) 0 0; max-width: 16ch; text-align: left; font: italic 400 var(--step-2) / 1.15 var(--font-display); color: var(--ink); }
@media (min-width: 700px) {
  .hero__quote { position: absolute; z-index: 2; left: 66%; top: 42%; max-width: min(16ch, 30vw); }
}

/* the name, then icon links; each icon has a 44px tap target around an 18px glyph */
.contact { display: inline-flex; align-items: center; gap: var(--space-1); }
.contact__name { margin-right: var(--space-1); }
.contact a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; color: var(--ink-dim); text-decoration: none; transition: color var(--t-fast); }
.contact a:hover { color: var(--ember-soft); }

.helix { position: relative; flex: 1; width: min(100%, 1280px); margin: 0 auto; display: flex; flex-direction: column; }
.helix__stage { flex: 1; min-height: 320px; touch-action: pan-y; cursor: grab; }
.helix__stage:active { cursor: grabbing; }
.helix__names { font-size: var(--step--1); }
.helix__names a { padding: 12px 4px; color: var(--hue); text-decoration: none; white-space: nowrap; }
.helix__names a:hover, .helix__names a.is-reading { text-decoration: underline; text-underline-offset: 4px; }
/* before helix.js places them (or without JS): one row of equal cells under the helix */
.helix:not(.is-placed) .helix__names { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); text-align: center; }
.helix.is-placed .helix__names { position: absolute; inset: 0; pointer-events: none; }
/* the helix stands upright, so each name sits to the right of its group, level with its middle. (Leader lines were
   tried 2026-10-03 and dropped: the helix turns, so a fixed line's end floats in space most of the time.) */
.helix.is-placed .helix__names a { position: absolute; transform: translate(0, -50%); pointer-events: auto; }

@media (max-width: 699px) {
  .helix { margin-top: var(--space-2); }
  .helix__stage { min-height: 70svh; }
}

/* once the helix has handed off to a chapter, its names would float over nothing: fade them out quickly
   (chapters.js sets body[data-active]); back at the top they return with the helix */
body:not([data-active="hero"]) .helix__names { opacity: 0; transition: opacity var(--t-fast); }
body:not([data-active="hero"]) .helix.is-placed .helix__names a { pointer-events: none; }

/* the text is there from the first frame; only the helix draws in. The names wait only until helix.js has placed them,
   so they never flash in the fallback row first. */
.helix.js-wait .helix__names { visibility: hidden; }

/* One chapter per project, all in one centred column: its motif (drawn by the field), the project's own screen at
   phone size, then the words. The showcase is always the biggest thing; the motif stays smaller than it. */
.chapter {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--space-5) var(--gutter) var(--space-6);
}
.chapter__motif { position: relative; width: min(64vw, var(--motif-w)); aspect-ratio: 18 / 7; }
.chapter__motif span {
  position: absolute; bottom: -4px; transform: translateX(-50%);
  font-size: var(--step--1); color: var(--ink-dim); white-space: nowrap;
}
.chapter__motif span.is-lit { color: var(--hue); }

/* one to three phones side by side; on a narrow screen, several become a swipeable row with the next peeking in */
.chapter__shows { margin-top: var(--space-3); display: flex; justify-content: center; gap: var(--space-4); }
@media (max-width: 999px) {
  .chapter__shows:not([data-count="1"]) {
    align-self: stretch; margin-inline: calc(-1 * var(--gutter)); padding-inline: max(11vw, calc(50vw - var(--show-w) / 2)); gap: var(--space-2);
    justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .chapter__shows:not([data-count="1"]) .chapter__show { flex: none; scroll-snap-align: center; }
}
.chapter__show {
  margin: 0; width: min(78vw, var(--show-w), calc(74svh * 390 / 844)); aspect-ratio: 390 / 844;
  border: 1px solid var(--line); border-radius: 22px; overflow: hidden; background: var(--bg-lift);
}
.chapter__show video, .chapter__show img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: inherit; }
/* pause and play (demos.js shows it; reduced motion keeps it hidden with the still): a 44px target around a small
   dim chip in the clip's corner, so it stays out of the screen's way */
.chapter__show { position: relative; }
.chapter__pause {
  position: absolute; right: var(--space-1); bottom: var(--space-1);
  display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
  border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer;
}
.chapter__pause::before {
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 50%;
  background: var(--bg); opacity: 0.72; transition: opacity var(--t-fast);
}
.chapter__pause:hover::before { opacity: 0.92; }
.chapter__pause:focus-visible { outline-offset: -4px; border-radius: 50%; }
/* the glyph: two bars while it plays, a triangle once held */
.chapter__pause span { position: relative; width: 10px; height: 11px; border-inline: 3px solid currentColor; }
.chapter__pause[aria-pressed="true"] span {
  width: 10px; border: 0; background: currentColor; clip-path: polygon(10% 0, 100% 50%, 10% 100%);
}
/* on a wide screen the clip sits in a thin phone outline */
@media (min-width: 700px) {
  .chapter__show { padding: 9px; border-radius: 40px; }
  .chapter__show video, .chapter__show img { border-radius: 31px; }
  .chapter__pause { right: var(--space-3); bottom: var(--space-3); }
}
@media (prefers-reduced-motion: reduce) { .chapter__pause::before { transition: none; } }

.chapter__head { width: min(100%, 40rem); margin-top: var(--space-3); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
.chapter__text { width: min(100%, 40rem); margin-top: var(--space-4); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
.chapter h2 { margin: 0; font: 400 var(--step-3) / 1 var(--font-display); }
.chapter__hook { margin: 0; max-width: 34em; font-size: var(--step-1); color: var(--ink-dim); text-wrap: balance; }
.chapter__num { margin: 0; display: flex; flex-direction: column; align-items: center; }
.chapter__num strong { font: 400 var(--step-3) / 1.05 var(--font-display); color: var(--hue); }
.chapter__num span { max-width: 26em; font-size: var(--step--1); color: var(--ink-dim); text-wrap: balance; }

.chapter__links { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--space-1); }
.chapter__status { padding: 10px var(--space-2); font-size: var(--step--1); color: var(--hue); }
.chapter__how[aria-expanded="true"] { border-color: var(--hue); color: var(--hue); }
/* opens in the page's flow under the buttons: plain text in the column, no panel, nothing covered */
.chapter__built { width: min(100%, 34rem); text-align: left; animation: built-in var(--t-slow) var(--ease-out); }
.chapter__built[hidden] { display: none; }
.chapter__stack { margin: 0 0 var(--space-2); color: var(--ink); }
.chapter__built ul { margin: 0; padding-left: 1.1em; font-size: var(--step--1); color: var(--ink-dim); }
.chapter__built li + li { margin-top: var(--space-1); }
.chapter__built li::marker { color: var(--hue); }
@keyframes built-in { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .chapter__built { animation: none; } }

.btn {
  display: inline-flex; align-items: center; min-height: 44px;
  padding: 0 var(--space-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;
  font-size: var(--step--1);
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
.btn:hover { border-color: var(--ember); color: var(--ember-soft); }
.btn--use { background: var(--ember); border-color: var(--ember); color: var(--bg); }
.btn--use:hover { background: var(--ember-soft); border-color: var(--ember-soft); color: var(--bg); }

/* footer: one row, kept minimal and laid out like the header. The wordmark (a link back to the top) and lab notes on
   the left, contacts on the right */
.foot { position: relative; padding: var(--space-2) var(--gutter); background: var(--bg); border-top: 1px solid var(--line); }
.foot__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); max-width: var(--bar-max); margin: 0 auto; font-size: var(--step--1); }
.foot__mark { color: var(--ink); text-decoration: none; }
.foot__mark:hover { color: var(--ember-soft); }
/* the contacts' auto left margin pushes them to the far side, with or without the lab link before them */
.foot__row .contact { margin-left: auto; }

/* back to top: a round button in the corner, shown by totop.js between the hero and the footer */
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
.to-top {
  position: fixed; z-index: 5; right: var(--gutter); bottom: var(--space-3);
  display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;
  border: 1px solid var(--line); border-radius: 50%; background: var(--bg-lift); color: var(--ink-dim);
  transition: color var(--t-fast), border-color var(--t-fast);
}
.to-top:hover { color: var(--ember-soft); border-color: var(--ember); }

/* The lab: the notes index, each note (.labpage), and the not-found page that borrows their shell.
   Reading pages, so one narrow column of plain text: no field, no motifs. */

.lab__h1 { margin: 0; font: 400 var(--step-3) / 1 var(--font-display); }
.lab__intro { margin: var(--space-2) 0 0; font-size: var(--step-1); color: var(--ink-dim); text-wrap: balance; }
.lab__empty { margin: var(--space-4) 0; padding: var(--space-2) 0; border-block: 1px solid var(--line); color: var(--ink-dim); }

.lab__list { margin: var(--space-4) 0; padding: 0; list-style: none; }
.lab__list li { padding: var(--space-2) 0; border-top: 1px solid var(--line); }
.lab__list li:last-child { border-bottom: 1px solid var(--line); }
.lab__list a { text-decoration: none; }
.lab__title { font: 400 var(--step-2) / 1.1 var(--font-display); }
.lab__list a:hover .lab__title { color: var(--ember-soft); }
.lab__list time { display: block; margin-top: var(--space-1); font-size: var(--step--1); color: var(--ink-dim); }
.lab__list p { margin: var(--space-1) 0 0; color: var(--ink-dim); }
.lab__tag {
  display: inline-block; margin-left: var(--space-1); padding: 0 var(--space-1); vertical-align: middle;
  border: 1px solid var(--line); border-radius: 999px; font: 400 var(--step--1) / 1.6 var(--font-body); color: var(--ember-soft);
}

/* the notes index and a note: their own pages */
/* the bar carries its own gutter here, so its cap grows by two gutters to line up with the home page's */
.labpage__bar { padding: var(--space-3) var(--gutter) 0; max-width: calc(var(--bar-max) + 2 * var(--gutter)); }
.labpage__bar .hero__mark { text-decoration: none; }
.labpage__body { width: min(100% - 2 * var(--gutter), 40rem); margin: 0 auto; padding: var(--space-5) 0 var(--space-6); }

/* not found: one line, then the ways back */
.missing__links { display: flex; flex-wrap: wrap; gap: 0 var(--space-3); margin: var(--space-3) 0 0; }

.note__back { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: var(--space-2); font-size: var(--step--1); color: var(--ink-dim); text-decoration: none; }
.note__back::before { content: "\2190\00a0"; }
.note__back:hover { color: var(--ember-soft); }
.note__meta { margin: var(--space-2) 0 var(--space-4); font-size: var(--step--1); color: var(--ink-dim); }
.note h2 { margin: var(--space-5) 0 var(--space-2); font: 400 var(--step-2) / 1.1 var(--font-display); }
.note h3 { margin: var(--space-4) 0 var(--space-1); font-size: var(--step-1); }
.note p, .note ul { margin: 0 0 var(--space-2); }
.note li + li { margin-top: var(--space-1); }
.note li::marker { color: var(--ember); }
.note a { color: var(--ember-soft); }
.note code { font-size: 0.9em; padding: 0.1em 0.35em; border-radius: 4px; background: var(--bg-lift); }
.note pre { margin: 0 0 var(--space-2); padding: var(--space-2); overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-lift); }
.note pre code { padding: 0; background: none; }

</style>
</head>
